<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">Tijera de acero damasco, filo convexo 3D</title>
  <desc id="d2">Placeholder de dirección de arte — sustituir por macro-fotografía real. Patrón damasco en tonos grises/acerados, acabado escarchado, alto contraste.</desc>
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#242628"/>
      <stop offset="60%" stop-color="#141517"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <linearGradient id="damascus" x1="0%" y1="0%" x2="86%" y2="34%">
      <stop offset="0%" stop-color="#f2f3f4"/>
      <stop offset="7%" stop-color="#8b8e92"/>
      <stop offset="14%" stop-color="#e6e7e9"/>
      <stop offset="21%" stop-color="#5c5f63"/>
      <stop offset="28%" stop-color="#d3d5d7"/>
      <stop offset="35%" stop-color="#75787c"/>
      <stop offset="42%" stop-color="#eceded"/>
      <stop offset="50%" stop-color="#4c4f53"/>
      <stop offset="58%" stop-color="#d9dbdc"/>
      <stop offset="66%" stop-color="#67696d"/>
      <stop offset="74%" stop-color="#e3e4e5"/>
      <stop offset="82%" stop-color="#57595d"/>
      <stop offset="90%" stop-color="#cfd1d2"/>
      <stop offset="100%" stop-color="#3a3c3f"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e3e5"/>
      <stop offset="50%" stop-color="#7a7d81"/>
      <stop offset="100%" stop-color="#242527"/>
    </linearGradient>
    <radialGradient id="screw2" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f4f5f6"/>
      <stop offset="60%" stop-color="#93969a"/>
      <stop offset="100%" stop-color="#1c1d1e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg2)"/>

  <!-- mangos: anillos grandes y simétricos (pieza escultórica) -->
  <line x1="300" y1="470" x2="565" y2="578" stroke="url(#ring2)" stroke-width="46" stroke-linecap="round"/>
  <line x1="300" y1="720" x2="565" y2="626" stroke="url(#ring2)" stroke-width="46" stroke-linecap="round"/>
  <circle cx="300" cy="470" r="90" fill="none" stroke="url(#ring2)" stroke-width="30"/>
  <circle cx="300" cy="720" r="90" fill="none" stroke="url(#ring2)" stroke-width="30"/>

  <!-- hoja superior, patron damasco -->
  <path d="M565,552 L920,458 L1130,378 L926,512 L565,610 Z" fill="url(#damascus)" stroke="#050506" stroke-width="4" stroke-linejoin="round"/>
  <path d="M605,542 L1090,392" stroke="#fafbfb" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <path d="M605,600 L1070,500" stroke="#050506" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- hoja inferior, patron damasco -->
  <path d="M565,602 L920,600 L1132,660 L928,682 L565,660 Z" fill="url(#damascus)" stroke="#050506" stroke-width="4" stroke-linejoin="round"/>
  <path d="M605,612 L1085,652" stroke="#fafbfb" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M605,654 L1070,668" stroke="#050506" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

  <!-- tornillo pivote -->
  <circle cx="580" cy="601" r="28" fill="url(#screw2)" stroke="#050506" stroke-width="3"/>
  <circle cx="580" cy="601" r="11" fill="#050506" opacity="0.5"/>
