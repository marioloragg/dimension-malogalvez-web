<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Tijera de corte clásica, filo convexo, mango offset</title>
  <desc id="d1">Placeholder de dirección de arte — sustituir por macro-fotografía real. Acero tipo ATS-314, acabado grafito mate, luz fría lateral.</desc>
  <defs>
    <radialGradient id="bg1" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2b2d30"/>
      <stop offset="60%" stop-color="#17181a"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="steel1" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#f3f4f5"/>
      <stop offset="28%" stop-color="#aeb1b5"/>
      <stop offset="52%" stop-color="#65676b"/>
      <stop offset="76%" stop-color="#c9cbce"/>
      <stop offset="100%" stop-color="#45474a"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9dbdd"/>
      <stop offset="50%" stop-color="#6c6e72"/>
      <stop offset="100%" stop-color="#2c2d2f"/>
    </linearGradient>
    <radialGradient id="screw1" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f0f1f2"/>
      <stop offset="60%" stop-color="#8a8d90"/>
      <stop offset="100%" stop-color="#1c1d1e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg1)"/>

  <!-- mangos / rings (offset: el anillo del pulgar es más pequeño y alto) -->
  <line x1="292" y1="486" x2="560" y2="582" stroke="url(#ring1)" stroke-width="40" stroke-linecap="round"/>
  <line x1="322" y1="708" x2="560" y2="626" stroke="url(#ring1)" stroke-width="46" stroke-linecap="round"/>
  <circle cx="292" cy="486" r="74" fill="none" stroke="url(#ring1)" stroke-width="26"/>
  <circle cx="322" cy="708" r="86" fill="none" stroke="url(#ring1)" stroke-width="28"/>

  <!-- hoja superior -->
  <path d="M560,558 L900,472 L1116,404 L906,524 L560,616 Z" fill="url(#steel1)" stroke="#0a0a0b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M600,548 L1080,414" stroke="#f4f5f6" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <path d="M600,606 L1060,510" stroke="#0a0a0b" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- hoja inferior -->
  <path d="M560,606 L900,598 L1118,650 L904,668 L560,662 Z" fill="url(#steel1)" stroke="#0a0a0b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M600,616 L1075,646" stroke="#f4f5f6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M600,656 L1060,662" stroke="#0a0a0b" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- tornillo pivote -->
  <circle cx="575" cy="601" r="26" fill="url(#screw1)" stroke="#0a0a0b" stroke-width="3"/>
  <circle cx="575" cy="601" r="10" fill="#0a0a0b" opacity="0.5"/>
</svg>
