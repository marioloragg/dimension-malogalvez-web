<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t3 d3">
  <title id="t3">Tijera de entresacar (texturizing) de hoja angulada</title>
  <desc id="d3">Placeholder de dirección de arte — sustituir por macro-fotografía real. Aleación cobalto-aluminio, hoja angulada con dientes finos, ángulo que muestre la dentadura.</desc>
  <defs>
    <radialGradient id="bg3" cx="52%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a2c2e"/>
      <stop offset="60%" stop-color="#16171a"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="steel3" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#eef0f1"/>
      <stop offset="30%" stop-color="#a3a6ab"/>
      <stop offset="55%" stop-color="#6a6d72"/>
      <stop offset="80%" stop-color="#c5c7ca"/>
      <stop offset="100%" stop-color="#4a4c50"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfe0e2"/>
      <stop offset="50%" stop-color="#8a8d91"/>
      <stop offset="100%" stop-color="#3a3c3f"/>
    </linearGradient>
    <radialGradient id="screw3" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f0f1f2"/>
      <stop offset="60%" stop-color="#8a8d90"/>
      <stop offset="100%" stop-color="#1c1d1e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg3)"/>

  <!-- mangos: aleación ligera, anillos más finos -->
  <line x1="296" y1="490" x2="560" y2="582" stroke="url(#ring3)" stroke-width="30" stroke-linecap="round"/>
  <line x1="296" y1="700" x2="560" y2="628" stroke="url(#ring3)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="296" cy="490" r="68" fill="none" stroke="url(#ring3)" stroke-width="18"/>
  <circle cx="296" cy="700" r="68" fill="none" stroke="url(#ring3)" stroke-width="18"/>

  <!-- hoja lisa (superior), en ángulo -->
  <path d="M560,558 L900,486 L1122,432 L906,528 L560,614 Z" fill="url(#steel3)" stroke="#08090a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M600,548 L1085,442" stroke="#f4f5f6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- hoja de entresacar (inferior): base + dentado angulado, bien marcado -->
  <path d="M560,606 L900,610 L1010,640 L560,660 Z" fill="url(#steel3)" stroke="#08090a" stroke-width="4" stroke-linejoin="round"/>
  <g fill="url(#steel3)" stroke="#08090a" stroke-width="3" stroke-linejoin="round">
    <path d="M900,610 L965,560 L1000,624 Z"/>
    <path d="M960,622 L1025,570 L1060,636 Z"/>
    <path d="M1018,634 L1083,580 L1118,648 Z"/>
  </g>
  <path d="M600,660 L1000,646" stroke="#08090a" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- tornillo pivote -->
  <circle cx="575" cy="601" r="24" fill="url(#screw3)" stroke="#08090a" stroke-width="3"/>
  <circle cx="575" cy="601" r="9" fill="#08090a" opacity="0.5"/>
</svg>
